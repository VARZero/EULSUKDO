name: Deploy generator to GitHub Pages

on:
  push:
    branches: [release_v1]
    paths:
      - '.github/workflows/generator-pages.yml'
      - 'gen/generator-app/**'
      - 'gen/src/RTL/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gen/generator-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: gen/generator-app
      - name: Build generator
        run: npm run build
        working-directory: gen/generator-app
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: gen/generator-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
